# Development config for arilboxd. Production defaults are in SPEC.md §16.
#   cargo run -p arilbox-daemon -- --config packaging/dev-config.toml
# Runtime files (self-signed cert, data) go under target/dev/, which git ignores.

[server]
bind = "127.0.0.1:8443"
tls_cert = "target/dev/tls/cert.pem"
tls_key = "target/dev/tls/key.pem"
tls = true
dev_mode = true

[paths]
data_dir = "target/dev/data"
catalog_dir = "catalog"

[network]
bridge = "arilbox0"
subnet = "10.88.0.1/24"

[[storage]]
name = "local-zfs"
type = "zfs"
dataset = "tank/arilbox"

[defaults]
storage = "local-zfs"
template = { distro = "debian", release = "13" }
