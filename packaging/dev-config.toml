# Development config for arilboxd with real LXC. Production defaults are in SPEC.md §16.
# Needs root (creates the arilbox0 bridge, an nftables table, dnsmasq, containers):
#   cargo build -p arilbox-daemon && sudo ./target/debug/arilboxd --config packaging/dev-config.toml
# Without root, use packaging/dev-config-mock.toml.
# Runtime files (self-signed cert, data) go under target/dev/, which git ignores.

[server]
bind = "127.0.0.1:8443"
tls_cert = "target/dev/tls/cert.pem"
tls_key = "target/dev/tls/key.pem"
tls = true
dev_mode = true

[containers]
backend = "lxc"
lxc_path = "/var/lib/lxc"

[paths]
data_dir = "target/dev/data"
catalog_dir = "catalog"

[network]
bridge = "arilbox0"
subnet = "10.88.0.1/24"

# Directory pool until ZFS is set up on the dev VM (ZFS storage arrives in M4).
[[storage]]
name = "local-dir"
type = "dir"
path = "/var/lib/arilbox/storage"

[[storage]]
name = "local-zfs"
type = "zfs"
dataset = "tank/arilbox"

[defaults]
storage = "local-dir"
template = { distro = "debian", release = "13" }
