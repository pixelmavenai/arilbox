# Managed by arilboxd — manual edits will be overwritten
lxc.uts.name = web
lxc.arch = amd64
lxc.rootfs.path = zfs:tank/arilbox/containers/web
lxc.idmap = u 0 100000 65536
lxc.idmap = g 0 100000 65536
lxc.apparmor.profile = generated
lxc.apparmor.allow_nesting = 1
lxc.seccomp.profile = /usr/share/lxc/config/common.seccomp
lxc.mount.auto = cgroup:mixed proc:mixed sys:mixed
lxc.mount.entry = /sys/fs/fuse/connections sys/fs/fuse/connections none bind,optional 0 0
lxc.pty.max = 1024
lxc.tty.max = 4
lxc.mount.entry = proc dev/.lxc/proc proc create=dir,optional 0 0
lxc.mount.entry = sys dev/.lxc/sys sysfs create=dir,optional 0 0
lxc.cgroup2.memory.max = max
lxc.cgroup2.memory.swap.max = max
lxc.cgroup2.cpu.max = max 100000
lxc.cgroup2.pids.max = 4096
lxc.start.auto = 0
lxc.net.0.type = veth
lxc.net.0.link = arilbox0
lxc.net.0.flags = up
lxc.net.0.name = eth0
lxc.net.0.hwaddr = 00:16:3e:4a:91:0c
