[package]
name = "arilbox-api"
description = "REST API (axum) for Arilbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Integration tests against real LXC and host networking (root). See CLAUDE.md.
lxc-integration = []

[dependencies]
argon2.workspace = true
arilbox-core.workspace = true
arilbox-net.workspace = true
arilxc.workspace = true
async-trait.workspace = true
axum.workspace = true
futures-util = { workspace = true, features = ["sink"] }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# WebSocket client for the console tests; already in the tree through axum's `ws` feature.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tower.workspace = true

[lints]
workspace = true
